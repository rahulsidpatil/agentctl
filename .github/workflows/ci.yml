name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . ruff build
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build packages
        run: python -m build
      - name: Check launcher
        run: |
          sh -n agentctl
          agentctl --version
