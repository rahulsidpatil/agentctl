name: Feature proposal
description: Propose a user outcome for agentctl.
title: "feature: "
labels: ["type:feature", "needs-design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the outcome a user cannot achieve safely today.
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Proposed user journey
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
  - type: textarea
    id: platforms
    attributes:
      label: Platforms and providers affected
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, compatibility, and recovery considerations
