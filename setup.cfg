[metadata]
name = agentctl
version = 0.3.0a2
description = Safely hand development work between AI coding agents
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
maintainer = Rahul Patil
maintainer_email = rahulsidpatil@users.noreply.github.com
url = https://github.com/rahulsidpatil/agentctl
project_urls =
    Documentation = https://github.com/rahulsidpatil/agentctl/tree/master/docs
    Issues = https://github.com/rahulsidpatil/agentctl/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    agentctl = agentctl.cli:main

[options.data_files]
share/agentctl/schemas =
    schemas/handoff.schema.json
    schemas/project.schema.json
